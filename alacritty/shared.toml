[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/home/linuxbrew/.linuxbrew/bin/zsh"

[window]
padding.x = 2
padding.y = 2
# spread leftover pixels (window height not a multiple of a text row) evenly instead of all at the bottom
dynamic_padding = true
decorations = "None"
opacity = 0.98

[keyboard]
bindings = [
{ key = "F11", action = "ToggleFullscreen" }
]

[terminal]
